<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Inventory – AutoServe Admin</title><link rel="stylesheet" href="../Public/Css/shared.css"/></head>
<body>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="app-layout">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand" style="display:flex;align-items:center;">
    <img src="../Public/images/LogoBrand/AutoServeLogo.jpg" alt="AutoServe" style="height:36px; border-radius:6px; margin-right:10px;">
    <div class="name" style="font-weight:800;font-size:1.4rem;color:var(--text);margin-right:auto;">Auto<span style="color:var(--primary)">Serve</span></div>
    <div class="role-tag">Admin Panel</div>
  </div>
  <div class="sidebar-section">Overview</div><nav class="sidebar-nav">
    <a href="admin-dashboard.html"><span class="s-icon">📊</span> Dashboard</a>
    <a href="admin-bookings.html"><span class="s-icon">📋</span> Bookings</a>
    <a href="admin-services.html"><span class="s-icon">🔧</span> Services</a>
  </nav>
  <div class="sidebar-section">Management</div><nav class="sidebar-nav">
    <a href="admin-staff.html"><span class="s-icon">👷</span> Staff</a>
    <a href="admin-vehicles.html"><span class="s-icon">🚗</span> Vehicles</a>
    <a href="admin-payments.html"><span class="s-icon">💰</span> Payments</a>
    <a href="admin-inventory.html" class="active"><span class="s-icon">📦</span> Inventory</a>
  </nav>
  <div class="sidebar-section">Analytics</div><nav class="sidebar-nav">
    <a href="admin-reports.html"><span class="s-icon">📈</span> Reports</a>
    <a href="admin-reviews.html"><span class="s-icon">⭐</span> Reviews</a>
  </nav>
  <div class="sidebar-section">System</div><nav class="sidebar-nav">
    <a href="admin-notifications.html"><span class="s-icon">🔔</span> Notifications</a>
    <a href="admin-cms.html"><span class="s-icon">🖊️</span> CMS</a>
    <a href="admin-settings.html"><span class="s-icon">⚙️</span> Settings</a>
    <a href="index.html"><span class="s-icon">🏠</span> Main Site</a>
    <a href="#" onclick="doLogout()"><span class="s-icon">🚪</span> Logout</a>
  </nav>
</aside>
<div class="main-content">
  <div class="main-header">
    <div class="flex-gap"><button id="sidebar-toggle" class="btn btn-ghost btn-sm btn-icon">☰</button><span class="main-title">Inventory Management</span></div>
    <button class="btn btn-primary btn-sm" onclick="openModal('inv-modal')">+ Add Item</button>
  </div>
  <div class="content-area">
    <div class="grid-4 mb-28" id="inv-stats"></div>
    <div style="display:grid;grid-template-columns:1fr 280px;gap:24px">
      <div class="card">
        <div class="card-header flex-between">
          <h3>Stock Items</h3>
          <input class="form-control" id="inv-search" placeholder="Search…" style="width:180px;padding:8px 14px"/>
        </div>
        <div id="inv-list" style="padding:0 24px 24px"></div>
      </div>
      <div class="card card-body">
        <h4 style="margin-bottom:14px">⚠️ Low Stock Alerts</h4>
        <div id="low-stock-list"></div>
      </div>
    </div>
  </div>
</div>
</div>

<div class="modal-overlay" id="inv-modal">
  <div class="modal" style="max-width:620px">
    <div class="modal-header"><div class="modal-title" id="inv-modal-title">Add Inventory Item</div><button class="modal-close" onclick="closeModal('inv-modal')">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Item Name *</label><input class="form-control" id="inv-name" placeholder="e.g. Engine Oil 5W-30"/></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Icon / Emoji</label><input class="form-control" id="inv-icon" placeholder="🛢️" maxlength="4"/></div>
        <div class="form-group"><label class="form-label">Category *</label>
          <select class="form-control" id="inv-cat">
            <option value="oils">🛢️ Oils &amp; Lubricants</option>
            <option value="filters">🌬️ Filters</option>
            <option value="brakes">🛑 Brakes &amp; Tyres</option>
            <option value="electrical">🔋 Electrical &amp; Battery</option>
            <option value="fluids">💧 Fluids &amp; Coolants</option>
            <option value="cleaning">🫧 Cleaning &amp; Detailing</option>
            <option value="belts">🔗 Belts &amp; Hoses</option>
            <option value="parts">🔩 Spare Parts</option>
            <option value="tools">🔧 Tools &amp; Equipment</option>
            <option value="other">📦 Other</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Unit (e.g. quarts, pcs, kg)</label><input class="form-control" id="inv-unit" placeholder="quarts"/></div>
        <div class="form-group"><label class="form-label">Cost Per Unit (EGP)</label><input class="form-control" id="inv-cost" type="number" min="0" placeholder="0.00" step="0.01"/></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Quantity in Stock *</label><input class="form-control" id="inv-qty" type="number" min="0" placeholder="10"/></div>
        <div class="form-group"><label class="form-label">Low Stock Alert At</label><input class="form-control" id="inv-low" type="number" min="0" placeholder="5"/></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Supplier / Brand</label><input class="form-control" id="inv-supplier" placeholder="e.g. Castrol, NGK, Bosch"/></div>
        <div class="form-group"><label class="form-label">Min. Order Qty</label><input class="form-control" id="inv-minorder" type="number" min="1" placeholder="1"/></div>
      </div>
      <div class="form-group"><label class="form-label">Notes / Description</label><textarea class="form-control" id="inv-notes" rows="2" placeholder="Optional: storage location, specs, etc."></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('inv-modal')">Cancel</button>
      <button class="btn btn-primary" id="inv-save">Add Item</button>
    </div>
  </div>
</div>

<div id="toast-root"></div>
<script src="../Public/Js/shared.js"></script>
<script src="../Public/Js/admin-inventory.js"></script>
</body>
</html>
