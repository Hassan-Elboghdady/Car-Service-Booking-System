<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>My Bookings � AutoServe</title>
  <meta name="description" content="View and manage all your AutoServe bookings."/>
  <link rel="stylesheet" href="../public/Css/shared.css"/>
  <link rel="stylesheet" href="../public/Css/my-bookings.css"/>
</head>
<body>
<div id="navbar-wrap"></div>
<div class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a><span class="breadcrumb-sep">�</span><span>My Bookings</span></div>
    <h1>My Bookings</h1>
    <p>View, track, and manage all your service bookings.</p>
  </div>
</div>
<section class="section-sm">
  <div class="container">
    <div id="bookings-auth-guard"></div>
    <div id="bookings-content" style="display:none">
      <div class="flex-between flex-wrap mb-24" style="gap:12px">
        <div class="tabs" id="status-tabs">
          <button class="tab-btn active" data-status="all">All</button>
          <button class="tab-btn" data-status="pending">Pending</button>
          <button class="tab-btn" data-status="in_progress">In Progress</button>
          <button class="tab-btn" data-status="completed">Completed</button>
          <button class="tab-btn" data-status="cancelled">Cancelled</button>
        </div>
        <a href="booking.html" class="btn btn-primary">+ New Booking</a>
      </div>
      <div id="bookings-list"></div>
    </div>
  </div>
</section>

<!-- Booking detail modal -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal" style="max-width:640px">
    <div class="modal-header">
      <div class="modal-title">Booking Details</div>
      <button class="modal-close" onclick="closeModal('detail-modal')">✕</button>
    </div>
    <div class="modal-body" id="detail-modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('detail-modal')">Close</button>
      <a class="btn btn-primary" id="detail-track-btn" href="tracker.html">Track Status ?</a>
    </div>
  </div>
</div>

<div id="footer-wrap"></div>
<script src="../public/Js/shared.js"></script>
<script src="../public/Js/my-bookings.js"></script>

<script>
  // MAGIC SCRIPT: Automatically makes all EJS links work as HTML 
  // so we don't have to modify the original backend JS files!
  setInterval(() => {
    document.querySelectorAll('a').forEach(a => {
      let h = a.getAttribute('href');
      if (h && h.includes('.ejs')) a.setAttribute('href', h.replace('.ejs', '.html'));
    });
    document.querySelectorAll('[onclick]').forEach(el => {
      let oc = el.getAttribute('onclick');
      if (oc && oc.includes('.ejs')) el.setAttribute('onclick', oc.replace('.ejs', '.html'));
    });
  }, 250);

  window.addEventListener('load', () => {
    if (typeof doLogout === 'function') {
      window.doLogout = async function() {
        localStorage.removeItem('as_session');
        if (typeof showToast === 'function') showToast('Logged out successfully', 'success');
        setTimeout(() => location.href = 'login.html', 700);
      };
    }
  });
</script>
</body>
</html>
