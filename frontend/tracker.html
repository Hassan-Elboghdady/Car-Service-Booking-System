<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Service Tracker  AutoServe</title>
  <meta name="description" content="Track your car service in real time with AutoServe's live service tracker."/>
  <link rel="stylesheet" href="../public/Css/shared.css"/>
  <link rel="stylesheet" href="../public/Css/tracker.css"/>
</head>
<body>
<div id="navbar-wrap"></div>
<div class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="index.ejs">Home</a><span class="breadcrumb-sep"></span><span>Tracker</span></div>
    <h1>Service Tracker</h1>
    <p>Real-time progress of your vehicle's service.</p>
  </div>
</div>
<section class="section-sm">
  <div class="container">
    <div id="tracker-auth-guard"></div>
    <div id="tracker-content" style="display:none">
      <!-- Booking selector -->
      <div class="card card-body mb-24">
        <div class="flex-between flex-wrap" style="gap:12px">
          <h3 style="font-size:1rem;margin-bottom:0">Select Booking to Track</h3>
          <select class="form-control" id="booking-selector" style="max-width:320px">
            <option value="">Choose a booking</option>
          </select>
        </div>
      </div>

      <!-- Tracker panel -->
      <div id="tracker-panel" style="display:none">
        <div class="tracker-layout">
          <!-- Status steps -->
          <div class="card card-body tracker-steps-card">
            <div class="flex-between mb-24">
              <h3>Service Progress</h3>
              <span id="tracker-status-badge"></span>
            </div>

            <div class="tracker-steps" id="tracker-steps">
              <!-- Generated by JS -->
            </div>
          </div>

          <!-- Info panel -->
          <div style="display:flex;flex-direction:column;gap:20px">
            <div class="card card-body">
              <h4 style="margin-bottom:16px">Booking Info</h4>
              <div id="tracker-info"></div>
            </div>
            <div class="card card-body">
              <h4 style="margin-bottom:16px">Timeline</h4>
              <div id="tracker-timeline"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Empty state -->
      <div id="tracker-empty" class="empty-state">
        <div class="empty-icon"></div>
        <h3>Select a booking above to track your service</h3>
        <a href="booking.ejs" class="btn btn-primary mt-16">Create a Booking</a>
      </div>
    </div>
  </div>
</section>
<div id="footer-wrap"></div>
<script src="../public/Js/shared.js"></script>
<script src="../public/Js/tracker.js"></script>


<script>
  // MAGIC SCRIPT: Automatically routes links between main folder and frontend folder
  setInterval(() => {
    const isMain = window.location.pathname.endsWith('/index.html') || window.location.pathname.endsWith('/') || !window.location.pathname.includes('/frontend/');
    
    function fixLink(href) {
      if (!href || !href.includes('.ejs')) return href;
      let page = href.split('/').pop().replace('.ejs', '.html');
      if (isMain) {
        if (page === 'index.html') return 'index.html';
        return 'frontend/' + page;
      } else {
        if (page === 'index.html') return '../index.html';
        return page;
      }
    }

    document.querySelectorAll('a').forEach(a => {
      let h = a.getAttribute('href');
      if (h && h.includes('.ejs')) a.setAttribute('href', fixLink(h));
    });
    document.querySelectorAll('[onclick]').forEach(el => {
      let oc = el.getAttribute('onclick');
      if (oc && oc.includes('.ejs')) {
        let match = oc.match(/'([^']+)'/);
        if(match) {
           let newHref = fixLink(match[1]);
           el.setAttribute('onclick', oc.replace(match[1], newHref));
        }
      }
    });
    
    // FIX IMAGE PATHS FOR MAIN FOLDER
    document.querySelectorAll('img').forEach(img => {
      let src = img.getAttribute('src');
      if (src && src.startsWith('../public/')) {
        if (isMain) {
          img.setAttribute('src', src.replace('../public/', 'public/'));
        }
      }
    });
  }, 250);

  window.addEventListener('load', () => {
    if (typeof doLogout === 'function') {
      window.doLogout = async function() {
        localStorage.removeItem('as_session');
        if (typeof showToast === 'function') showToast('Logged out successfully', 'success');
        const isMain = window.location.pathname.endsWith('/index.html') || window.location.pathname.endsWith('/') || !window.location.pathname.includes('/frontend/');
        setTimeout(() => location.href = isMain ? 'frontend/login.html' : 'login.html', 700);
      };
    }
  });
</script>
</body>
</html>
