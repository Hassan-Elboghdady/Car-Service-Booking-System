<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>My Profile � AutoServe</title>
  <link rel="stylesheet" href="../public/Css/shared.css"/>
  <link rel="stylesheet" href="../public/Css/profile.css"/>
</head>
<body>
<div id="navbar-wrap"></div>
<div class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a><span class="breadcrumb-sep">�</span><span>Profile</span></div>
    <h1>My Profile</h1>
  </div>
</div>
<section class="section-sm">
  <div class="container">
    <div id="profile-auth-guard"></div>
    <div id="profile-content" style="display:none">
      <div class="profile-layout">

        <!-- LEFT: Avatar + Stats -->
        <div style="display:flex;flex-direction:column;gap:20px">
          <div class="card card-body text-center">
            <div class="profile-avatar" id="p-avatar">A</div>
            <h3 id="p-name">�</h3>
            <p id="p-role-badge"></p>
            <div class="profile-stats-grid">
              <div class="p-stat"><div class="ps-val" id="p-bookings">0</div><div class="ps-label">Bookings</div></div>
              <div class="p-stat"><div class="ps-val" id="p-points">0</div><div class="ps-label">Points ?</div></div>
              <div class="p-stat"><div class="ps-val" id="p-cars">0</div><div class="ps-label">Cars</div></div>
            </div>
          </div>
          <!-- Loyalty card -->
          <div class="loyalty-card">
            <div class="lc-label">Loyalty Tier</div>
            <div class="lc-tier" id="p-tier">Silver</div>
            <div class="lc-points"><span id="p-pts2">0</span> points</div>
            <div class="progress-bar mt-12"><div class="progress-fill" id="p-pts-bar" style="width:0%;background:rgba(255,255,255,.7)"></div></div>
            <div style="font-size:.72rem;opacity:.7;margin-top:6px" id="p-pts-label">0 points to Gold tier</div>
          </div>
        </div>

        <!-- RIGHT: Tabs -->
        <div>
          <div class="tabs mb-24" id="prof-tabs">
            <button class="tab-btn active" data-pt="info">Account Info</button>
            <button class="tab-btn" data-pt="security">Security</button>
            <button class="tab-btn" data-pt="cars">My Cars</button>
            <button class="tab-btn" data-pt="reviews">Leave Review</button>
          </div>

          <!-- Info tab -->
          <div id="pt-info" class="pt-panel">
            <div class="card card-body">
              <div id="info-alert"></div>
              <div class="form-row">
                <div class="form-group"><label class="form-label">First Name *</label><input class="form-control" id="p-first"/></div>
                <div class="form-group"><label class="form-label">Last Name *</label><input class="form-control" id="p-last"/></div>
              </div>
              <div class="form-group"><label class="form-label">Email</label><input class="form-control" id="p-email" type="email"/></div>
              <div class="form-group"><label class="form-label">Phone</label><input class="form-control" id="p-phone" type="tel"/></div>
              <button class="btn btn-primary" id="p-save">Save Changes</button>
            </div>
          </div>

          <!-- Security tab -->
          <div id="pt-security" class="pt-panel" style="display:none">
            <div class="card card-body">
              <div id="sec-alert"></div>
              <div class="form-group"><label class="form-label">Current Password</label><input class="form-control" id="sec-cur" type="password"/></div>
              <div class="form-group"><label class="form-label">New Password</label><input class="form-control" id="sec-new" type="password"/></div>
              <div class="form-group"><label class="form-label">Confirm Password</label><input class="form-control" id="sec-conf" type="password"/></div>
              <button class="btn btn-primary" id="sec-save">Change Password</button>
            </div>
          </div>

          <!-- Cars tab -->
          <div id="pt-cars" class="pt-panel" style="display:none">
            <div class="flex-between mb-16">
              <h4 style="margin:0">My Registered Cars</h4>
              <a href="cars.html" class="btn btn-outline btn-sm">Manage Vehicles ?</a>
            </div>
            <div id="prof-cars-list"></div>
          </div>

          <!-- Reviews tab -->
          <div id="pt-reviews" class="pt-panel" style="display:none">
            <div class="card card-body">
              <h4 style="margin-bottom:16px">Leave a Review</h4>
              <div id="rev-alert"></div>
              <div class="form-group">
                <label class="form-label">Rating *</label>
                <div class="star-picker" id="star-picker">
                  <span class="star" data-v="1">?</span><span class="star" data-v="2">?</span>
                  <span class="star" data-v="3">?</span><span class="star" data-v="4">?</span><span class="star" data-v="5">?</span>
                </div>
                <input type="hidden" id="rev-rating" value="0"/>
              </div>
              <div class="form-group"><label class="form-label">Your Review *</label><textarea class="form-control" id="rev-text" rows="4" placeholder="Tell us about your experience�"></textarea></div>
              <button class="btn btn-primary" id="rev-submit">Submit Review</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<div id="footer-wrap"></div>
<script src="../public/Js/shared.js"></script>
<script src="../public/Js/profile.js"></script>

<script>
  // MAGIC SCRIPT: Automatically makes all EJS links work as HTML 
  // so we don't have to modify the original backend JS files!
  setInterval(() => {
    document.querySelectorAll('a').forEach(a => {
      let h = a.getAttribute('href');
      if (h && h.includes('.ejs')) a.setAttribute('href', h.replace('.ejs', '.html'));
    });
    document.querySelectorAll('[onclick]').forEach(el => {
      let oc = el.getAttribute('onclick');
      if (oc && oc.includes('.ejs')) el.setAttribute('onclick', oc.replace('.ejs', '.html'));
    });
  }, 250);

  window.addEventListener('load', () => {
    if (typeof doLogout === 'function') {
      window.doLogout = async function() {
        localStorage.removeItem('as_session');
        if (typeof showToast === 'function') showToast('Logged out successfully', 'success');
        setTimeout(() => location.href = 'login.html', 700);
      };
    }
  });
</script>
</body>
</html>
